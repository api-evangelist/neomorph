  capability registry WordPress ships as the substrate for MCP-style tool exposure — but it is fully
  auth-gated here, returning rest_forbidden at HTTP 401 for both /abilities and /categories, so not
  even the names of its abilities are anonymously readable. That is the closest this provider comes to
  an agent surface, and it is closed.
