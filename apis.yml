aid: neomorph
name: Neomorph
description: >-
  Neomorph, Inc. is a venture-backed, clinical-stage biotechnology company headquartered at 5590
  Morehouse Drive in San Diego, California, founded in 2020 to design molecular glue degraders —
  small molecules that bind an E3 ubiquitin ligase, reshape it into a new "neomorphic" surface, and
  recruit disease-causing proteins to the proteasome for destruction. The approach targets the
  roughly 85% of the human proteome considered undruggable by conventional small molecules because
  it needs no traditional binding pocket. Neomorph's platform reaches beyond cereblon to hundreds of
  E3 ligases and multiple proprietary degrons, which the company describes as the largest proprietary
  molecular glue target space in the field. Its lead programme, NEO-811, targets ARNT/HIF-1β in
  clear cell renal cell carcinoma and entered a Phase 1/2 trial in February 2026; the rest of the
  pipeline spans undisclosed solid tumors plus partnered oncology/immunology, neurology and
  cardiometabolic/rare disease targets. The company closed a $109 million Series A in December 2020
  and a $100 million Series B in April 2026, and runs multi-target discovery collaborations with Novo
  Nordisk (February 2024), Biogen (October 2024) and AbbVie (January 2025). Philip Chamberlain, DPhil
  is CEO and Robert J. Hugin was appointed Chairman of the Board in May 2026. Neomorph runs no
  developer program and publishes no product API, developer portal, API reference, SDK or pricing.
  The only machine-readable surface reachable without credentials is the WordPress REST content API
  behind neomorph.com, catalogued here.
