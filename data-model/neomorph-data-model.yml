extension_fields:
- name: acf
  present_on: [Post, Page, TeamMember, Publication, Media, Category, Tag, TeamCategory, Comment]
  declared_in_schema: true
  populated_anonymously: false
  detail: >-
    Advanced Custom Fields payload. It is declared on every entity's schema and it is returned on every
    anonymous response — as an EMPTY ARRAY. Verified on TeamMember 1535 and Publication 1430, both of
    which returned `"acf": []`. The site's own `meta` object carries `_acf_changed`, so ACF field
    groups do exist on this deployment; their values are simply not exposed to unauthenticated
    callers. This is the single most consequential gap in the model: TeamMember has no `content` field
    at all, so a team member's job title and biography — the thing the /about/ pages actually display —
    are NOT retrievable through this API. Only the person's name (`title`), slug, portrait and
    category are. Publication likewise exposes `content` but no structured citation metadata (journal,
    DOI, year, authors); those live in ACF and read as empty.
- name: meta
  present_on: [Post, Page, TeamMember, Publication, Media, Category, Tag, TeamCategory, Comment]
  detail: >-
    WordPress post meta, limited to keys registered with show_in_rest. On this deployment it is
    populated but carries only Astra theme layout keys (site-sidebar-layout, site-content-layout,
    ast-global-*) and `_acf_changed` — presentation and infrastructure state, no company content.
- name: class_list
  present_on: [Post, Page, TeamMember, Publication, Media]
  detail: >-
    The CSS class array WordPress generates for the object. Incidental, but it is the one place a
    taxonomy assignment appears as a readable slug rather than a bare term id — TeamMember 1535
    carries `team_category-board-of-directors`, which is resolvable without a second request.
- name: smush
  present_on: [Media]
  detail: Image-optimisation plugin state. Infrastructure metadata, not content.
traversal:
  mechanism: _links
  detail: >-
    Every object carries a HAL-like `_links` object with self, collection, about, author,
    wp:featuredmedia, wp:attachment and wp:term entries under the curie base https://api.w.org/{rel}.
    Adding `_embed` to any request inlines the linked objects under `_embedded`, so the whole graph
    above is walkable in a single request without constructing URLs — except for author, which
    terminates at a 403.
