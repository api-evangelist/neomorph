- name: TeamCategory
  collection: /wp/v2/team_category
  count_at_harvest: 4
  taxonomy: team_category
  hierarchical: true
  detail: >-
    Neomorph-specific taxonomy grouping the Team collection: Management (11), Board of Directors (7),
