  type: belongs_to
  via: post
  detail: The object this attachment was uploaded to. Polymorphic — resolves to a Post, Page, TeamMember or Publication id.
- from: Category
  to: Category
  type: belongs_to
  via: parent
  detail: Hierarchical taxonomy. Not exercised — both terms are top-level.
- from: TeamCategory
  to: TeamCategory
  type: belongs_to
  via: parent
  detail: Hierarchical taxonomy. Not exercised — all four terms are top-level.
- from: Comment
