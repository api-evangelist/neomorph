  key_fields: [id, title, url, type, subtype, _links]
relationships:
- from: Post
  to: Category
  type: has_many
  via: categories
  detail: Array of category term ids. Filterable in reverse with ?categories= on the collection.
- from: Post
  to: Tag
  type: has_many
  via: tags
  detail: Array of post_tag term ids. Always empty on this deployment — the taxonomy has no terms.
- from: Post
  to: Media
  type: has_one
  via: featured_media
  detail: Integer media id, 0 when unset.
- from: Post
  to: User
  type: belongs_to
  via: author
  detail: >-
    Integer user id. The relationship is declared in the schema and the id is returned, but the User
    entity itself is NOT resolvable — /wp/v2/users is blocked at the edge with an HTML 403. This is the
    one dangling reference in the model.
- from: Page
  to: Page
  type: belongs_to
  via: parent
  detail: >-
    Self-referential hierarchy. Exercised on this deployment — the NEO-811 page (id 1476) is a child
    of the Pipeline page.
- from: Page
  to: Media
  type: has_one
  via: featured_media
- from: Page
  to: User
  type: belongs_to
  via: author
  detail: Same dangling reference as Post.author.
- from: TeamMember
  to: TeamCategory
  type: has_many
  via: team_category
  detail: >-
