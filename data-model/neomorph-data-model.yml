method: derived
source: >-
  Derived from the JSON Schema response descriptors returned by OPTIONS on every catalogued route of
  https://neomorph.com/wp-json (harvested 2026-08-26) and from the _links/curies hypermedia the live
  responses carry. Every entity, field and relationship below appears verbatim in that deployment's
  own descriptors; nothing is inferred from WordPress documentation.
note: >-
  This is the entity graph of a corporate content management system, not of a product. Its shape is
  WordPress core plus two custom post types and one custom taxonomy that Neomorph's site builders
  registered — `team`, `resource` (surfaced publicly as Publications) and `team_category`. Those three
  are the only Neomorph-specific structures in the model, and they are what make this graph worth
  recording: they say the site is organised around people and peer-reviewed literature.
id_scheme:
  type: integer
  detail: >-
    Every entity is keyed by a monotonically-assigned WordPress integer id. There are no prefixed or
    typed identifiers, so an id is only meaningful together with the collection it came from — id 1476
    is a page and id 1506 is a post. Objects additionally carry a `slug` (URL-safe, unique within a
    collection) and a `guid` that is a permalink-shaped string, not a resolvable canonical URI.
entities:
- name: Post
  collection: /wp/v2/posts
  count_at_harvest: 14
  detail: Press releases and media coverage. The company news archive.
  key_fields: [id, slug, date, date_gmt, modified, title, content, excerpt, link, status, author, featured_media, categories, tags, format, sticky, meta, acf]
- name: Page
  collection: /wp/v2/pages
  count_at_harvest: 15
  detail: Corporate pages, including the NEO-811 programme page nested under /pipeline/.
  key_fields: [id, slug, date, modified, title, content, excerpt, link, status, parent, menu_order, author, featured_media, template, meta, acf]
- name: TeamMember
  collection: /wp/v2/team
  count_at_harvest: 19
  custom_post_type: team
  detail: >-
    Management, board of directors and scientific founders. Neomorph-specific type. Note the schema
    carries NO `content` field — biography copy lives in the `acf` (Advanced Custom Fields) object,
    which is exposed on the anonymous surface.
  key_fields: [id, slug, date, modified, title, link, status, featured_media, team_category, template, meta, acf]
- name: Publication
  collection: /wp/v2/resource
  count_at_harvest: 11
  custom_post_type: resource
  detail: >-
    Peer-reviewed molecular glue and targeted protein degradation literature, 2014-2022. Neomorph-
    specific type. Carries `content` and `menu_order` but, unlike Post, no author, categories or tags —
    citation metadata is carried in `acf`.
  key_fields: [id, slug, date, modified, title, content, link, status, featured_media, menu_order, template, meta, acf]
- name: Media
  collection: /wp/v2/media
  count_at_harvest: 111
  detail: >-
    Attachments — team portraits, pipeline and platform figures, logos, press assets. The richest
    entity in the model.
  key_fields: [id, slug, date, modified, title, link, alt_text, caption, description, media_type, mime_type, media_details, source_url, filename, filesize, post, author]
- name: Category
  collection: /wp/v2/categories
  count_at_harvest: 2
  taxonomy: category
  hierarchical: true
  detail: 'Two terms registered: Press Release (13 posts) and In The Media (1 post).'
  key_fields: [id, name, slug, description, count, link, taxonomy, parent, meta, acf]
- name: Tag
  collection: /wp/v2/tags
  count_at_harvest: 0
  taxonomy: post_tag
