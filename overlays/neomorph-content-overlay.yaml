- target: $.paths['/wp/v2/posts'].get
  update:
    x-apievangelist-note: >-
      The company news archive and the highest-value operation on this surface — 14 press releases and
      media items from 2020-12-20 (the $109M Series A) to 2026-05-13 (Robert J. Hugin appointed
      Chairman), classified by the two registered categories Press Release (13) and In The Media (1).
- target: $.paths['/wp/v2/resource'].get
  update:
    x-apievangelist-note: >-
      `resource` is Neomorph's custom post type for peer-reviewed literature; it is surfaced publicly
      as "Publications". Eleven records spanning 2014-2022, including the founding structural work on
      the CRBN-DDB1-thalidomide complex and the CELMoD cereblon-conformation paper. The rest_base is
      `resource`, not `publications` — an agent must address /wp/v2/resource.
- target: $.paths['/wp/v2/team'].get
  update:
    x-apievangelist-note: >-
      `team` is Neomorph's custom post type for people. 19 published records. IMPORTANT LIMITATION —
      the schema carries no `content` field and the `acf` object reads as an empty array anonymously,
      so job titles and biographies are NOT retrievable here even though the website renders them. An
      agent gets a name, a slug, a portrait id and a team_category id, and must fall back to the HTML
      page at `link` for anything more.
- target: $.paths['/wp/v2/team_category'].get
  update:
    x-apievangelist-note: >-
      Four terms registered — Management (11), Board of Directors (7), Scientific Founders (4) and
      Scientific Advisory Board (0). The last is registered but unpopulated; do not read its existence
      as evidence of a seated SAB.
- target: $.paths['/wp/v2/tags'].get
  update:
    x-apievangelist-note: Registered and reachable but empty (X-WP-Total 0) on this deployment.
- target: $.paths['/wp/v2/comments'].get
  update:
    x-apievangelist-note: Registered and reachable but empty (X-WP-Total 0) on this deployment.
- target: $.paths['/'].get
  update:
    x-apievangelist-note: >-
      The route index is the reason a contract exists for this provider at all. 649,729 bytes, 432
      routes, 23 namespaces, each carrying its own args — combined with per-route OPTIONS it is a
      complete machine-readable self-description, which is more than most companies with an actual
      developer program publish.
- target: $.components.schemas.Team
  update:
    x-apievangelist-note: >-
      `acf` and `meta` are deployment-specific extensions from the Advanced Custom Fields plugin and
      the Astra theme, not part of the upstream wp/v2 contract. `acf` was observed empty on every
      anonymous response on 2026-08-26; `meta` carries only Astra layout keys. Both may change on a
      plugin or theme update without notice.
- target: $.components.schemas.Error
  update:
    x-apievangelist-note: >-
      Not RFC 9457. The WordPress WP_Error envelope is served as application/json with a flat
      {code, message, data.status} shape. Branch on `code`, never on `message`.
