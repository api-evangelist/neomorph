          description: Meta fields.
        template:
          type: string
          description: The theme file to use to display the post.
        acf:
          type: object
          properties: []
          description: ACF field data
        smush:
          type: string
          description: Smush data.
        alt_text:
          type: string
          description: Alternative text to display when attachment is not displayed.
        caption:
          type: object
          properties:
            raw:
              type: string
            rendered:
              type: string
              readOnly: true
          description: The attachment caption.
        description:
          type: object
          properties:
            raw:
              type: string
            rendered:
              type: string
              readOnly: true
          description: The attachment description.
        media_type:
          type: string
          enum:
          - image
          - file
          readOnly: true
          description: Attachment type.
        mime_type:
          type: string
          readOnly: true
          description: The attachment MIME type.
        media_details:
          type: object
          readOnly: true
          description: Details about the media file, specific to its type.
        post:
          type: integer
          description: The ID for the associated post of the attachment.
        source_url:
          type: string
          format: uri
          readOnly: true
          description: URL to the original attachment file.
        missing_image_sizes:
          type: array
          items:
            type: string
          readOnly: true
          description: List of the missing image sizes of the attachment.
        filename:
          type: string
          readOnly: true
          description: Original attachment file name.
        filesize:
          type:
          - integer
          - 'null'
          readOnly: true
          description: Attachment file size in bytes.
        exif_orientation:
          type: integer
          readOnly: true
          description: EXIF orientation value. Values 1-8 follow the EXIF specification, where 1 means
            no rotation needed.
        image_quality:
          type: object
          properties:
            default:
              type: integer
              minimum: 1
              maximum: 100
            sizes:
              type: object
              properties:
                medium_large:
                  type: integer
                  minimum: 1
                  maximum: 100
                1536x1536:
                  type: integer
                  minimum: 1
                  maximum: 100
                2048x2048:
                  type: integer
                  minimum: 1
                  maximum: 100
          readOnly: true
          description: Encode quality (1-100) from the wp_editor_set_quality filter, resolved against
            the output MIME type. The "default" value applies to the full-size image; "sizes" lists per-registered-size
            overrides where the filtered value differs from "default".
        image_output_format:
          type:
          - string
          - 'null'
          readOnly: true
          description: The output MIME type this image should be converted to, based on the image_editor_output_format
            filter. Null if no conversion is needed.
        image_save_progressive:
          type: boolean
          readOnly: true
          description: Whether to use progressive/interlaced encoding when saving this image.
    Error:
      type: object
      title: WP_Error
      description: The WordPress REST error envelope. It is NOT RFC 9457 application/problem+json; it
        is served as application/json.
      properties:
        code:
          type: string
          description: Machine-readable error slug, e.g. rest_post_invalid_id.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          description: Error detail.
          properties:
            status:
              type: integer
              description: HTTP status code.
            params:
              type: object
              description: Per-parameter validation messages, on 400.
            details:
              type: object
              description: Per-parameter validation detail, on 400.
      required:
      - code
      - message
  responses:
    InvalidParam:
      description: Invalid parameter. Returns `rest_invalid_param` with a per-parameter breakdown in `data.params`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Authentication required. Returns `rest_forbidden` (or a route-specific slug) with
        `data.status: 401`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No route or resource matched. Returns `rest_no_route` or a `rest_*_invalid_id` slug
        with `data.status: 404`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
