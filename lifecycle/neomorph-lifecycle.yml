generated: '2026-08-26'
method: probed
source: >-
  Live anonymous probes of neomorph.com and its WordPress REST route index on 2026-08-26, plus a
  search of the public site for a versioning policy, deprecation policy, SLA, status page or changelog.
note: >-
  Neomorph runs no developer program, so it publishes no API lifecycle policy of any kind. That is the
  finding, not an omission in this file. Everything recorded below is either an observed property of
  the deployment or an explicit "not published" with the probe that established it. No StatusPage or
  Deprecation pointer is emitted in apis.yml, because there is no status page and no deprecation
  policy to point at.
versioning:
  scheme: namespace-in-path
  current: wp/v2
  additional: oembed/1.0
  policy_published: false
  detail: >-
    The version is the namespace segment following /wp-json. Neomorph does not own this contract — it
    inherits whatever namespace set the installed WordPress core and plugins register. Between the
    route index and the responses, 23 namespaces were registered on 2026-08-26; the catalogued surface
    uses two of them. WordPress core has never retired wp/v2, but Neomorph has made no commitment about
    it, and an unannounced plugin change can add or remove a namespace at any time.
  breaking_change_notice: none published
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  detail: >-
    No RFC 8594 Sunset or Deprecation header was returned on any observed response, and no deprecation
    policy exists on the site. No catalogued operation is marked deprecated in any OpenAPI document in
    openapi/ — because none is marked deprecated in the deployment's own route descriptors, not because
    the question was skipped.
  deprecated_operations: []
sla:
  published: false
  detail: No service-level agreement, uptime target or support commitment is published.
status_page:
  published: false
  url: null
  probes:
