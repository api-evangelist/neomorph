  detail: >-
    No status page. The deployment is a single-origin nginx WordPress install behind a caching layer;
    availability is not reported anywhere a machine can read.
changelog:
  published: false
  detail: >-
    No API changelog and no release notes. The nearest dated public record of change is the corporate
    news archive at /news/, which is a press-release feed about the company (financings, partnerships,
    clinical milestones, appointments) and says nothing about this interface. It is catalogued as the
    News API and wired as BlogRSS; it is deliberately NOT wired as a ChangeLog pointer, because it is
    not one.
  news_archive: https://neomorph.com/news/
  news_feed: https://neomorph.com/feed/
observed_stability:
